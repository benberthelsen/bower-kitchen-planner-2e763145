project_id = "ehtwywctledgkxexztbh"

[functions.import-microvellum]
verify_jwt = false

# The homeowner wizard (/wizard) is a PUBLIC page — anonymous visitors call
# ai-designer. Match the public image functions so the anon call isn't gated.
# The function still rate-limits per IP and only returns a price band + layout.
[functions.ai-designer]
verify_jwt = false

# Public, capability/rate-limited homeowner entry points. Each function owns
# strict body validation; requiring a user JWT would reject organic visitors.
[functions.submit-planner-enquiry]
verify_jwt = false

[functions.sync-buildflow-lead]
verify_jwt = true

[functions.create-planner-handoff]
verify_jwt = false

[functions.get-planner-handoff]
verify_jwt = false

# Synthetic usability control is protected by a separate server-only secret.
# It never accepts a public URL flag and has no browser-readable data policies.
[functions.synthetic-test-control]
verify_jwt = false

# process-dxf-geometry now enforces an authenticated admin in-code for every
# action (review #2), so require a JWT at the edge too. scheduled-supplier-import
# stays open because pg_cron/pg_net invoke it with the service role, not a user JWT.
[functions.process-dxf-geometry]
verify_jwt = true

[functions.scheduled-supplier-import]
verify_jwt = false
