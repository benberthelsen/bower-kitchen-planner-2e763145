# Deploys Supabase Edge Functions from main, on request only.
#
# Actions -> "Deploy Edge functions" -> Run workflow, then type the function
# names (space separated) or "all" for the standard planner set. Needs the
# repository secret SUPABASE_ACCESS_TOKEN (a Supabase personal access token).
#
# Each function's JWT gate is set explicitly to match production, because
# config.toml does not list every function and the CLI default (verify on)
# would silently change send-email and promote-ai-design.
name: Deploy Edge functions

on:
  workflow_dispatch:
    inputs:
      functions:
        description: 'Function names separated by spaces, or "all"'
        required: true
        default: all

permissions:
  contents: read

concurrency:
  group: deploy-edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ehtwywctledgkxexztbh
          FUNCTIONS: ${{ inputs.functions }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::Repository secret SUPABASE_ACCESS_TOKEN is not set."
            exit 1
          fi

          # Production JWT gate per function (false = the function checks auth itself).
          declare -A VERIFY=(
            [ai-designer]=false
            [submit-planner-enquiry]=false
            [create-planner-handoff]=false
            [get-planner-handoff]=false
            [send-email]=false
            [promote-ai-design]=false
            [price-quote]=false
            [csp-report]=false
            [room-document-candidates]=false
            [link-trade-handoff]=true
            [sync-buildflow-lead]=true
            [sync-buildflow-design]=true
            [scanner-private-bridge]=true
          )
          STANDARD="ai-designer submit-planner-enquiry create-planner-handoff get-planner-handoff promote-ai-design send-email sync-buildflow-lead sync-buildflow-design link-trade-handoff scanner-private-bridge csp-report"

          if [ "${FUNCTIONS}" = "all" ]; then LIST="${STANDARD}"; else LIST="${FUNCTIONS}"; fi

          # Validate every name before deploying anything.
          for fn in ${LIST}; do
            if [ -z "${VERIFY[$fn]+set}" ]; then
              echo "::error::Unknown function '$fn'. Allowed: ${!VERIFY[*]}"
              exit 1
            fi
          done

          for fn in ${LIST}; do
            if [ ! -f "supabase/functions/${fn}/index.ts" ]; then
              echo "Skipping ${fn}: not on main yet."
              continue
            fi
            flag=""
            if [ "${VERIFY[$fn]}" = "false" ]; then flag="--no-verify-jwt"; fi
            echo "::group::Deploy ${fn} (verify_jwt=${VERIFY[$fn]})"
            supabase functions deploy "${fn}" --project-ref "${PROJECT_REF}" --use-api ${flag}
            echo "::endgroup::"
          done
