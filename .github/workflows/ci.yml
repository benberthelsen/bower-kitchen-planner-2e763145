name: Release checks

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: release-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out website contract consumer
        uses: actions/checkout@v4
        with:
          repository: benberthelsen/bower-cabinet-web-site
          path: website
          # This preview PR is paired with website PR #13. Other PRs and main
          # keep checking the released website contract on main.
          ref: ${{ github.head_ref == 'codex/shared-room-geometry' && 'codex/shared-room-geometry-handoff' || 'main' }}
          ssh-key: ${{ secrets.WEBSITE_REPO_SSH_KEY }}

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run release checks
        run: npm run test:ci
        env:
          WEBSITE_REPO: website
